prefix: /api/v1/swarm
websocket: /api/v1/ws/swarm
endpoints:
- method: GET
  path: /objects/{id}
- method: POST
  path: /objects/query
- method: GET
  path: /objects/{id}/links
- method: GET
  path: /objects/{id}/timeline
- method: GET
  path: /objects/{id}/trace
- method: POST
  path: /graph/neighborhood
- method: POST
  path: /graph/path
- method: POST
  path: /graph/matrix
- method: GET
  path: /operations/summary
- method: GET
  path: /queues
- method: GET
  path: /workers
- method: GET
  path: /workers/{id}
- method: GET
  path: /tasks/{id}
- method: POST
  path: /candidates/query
- method: GET
  path: /candidates/{id}
- method: GET
  path: /candidates/{id}/atoms
- method: GET
  path: /trends
- method: GET
  path: /trends/{id}
- method: GET
  path: /compositions/{id}
- method: POST
  path: /compositions
- method: POST
  path: /compositions/{id}/variants
- method: POST
  path: /compositions/{id}/render
- method: GET
  path: /accounts
- method: GET
  path: /accounts/{id}
- method: GET
  path: /accounts/{id}/audience-genome
- method: GET
  path: /accounts/{id}/performance
- method: GET
  path: /experiments
- method: POST
  path: /experiments
- method: GET
  path: /experiments/{id}
- method: GET
  path: /traces/{trace_id}
- method: GET
  path: /replay/snapshot
- method: POST
  path: /commands/execute
websocket_contract:
  subscription_message:
    op: subscribe
    topics:
    - objects
    - tasks
    - workers
    - queues
    - alerts
    - metrics
    - traces
  reconnect_parameter: last_sequence
  ordered_sequence_required: true
